name: meifagundesdotcom
description: Formada no CEFET-MG e Consultora de Software na Thoughtworks - Projetos pessoais
publish_to: "none" # Remove this line if you wish to
version: 1.7.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  url_launcher: ^6.3.3
  http: ^1.6.0
  shared_preferences: ^2.5.6
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf
